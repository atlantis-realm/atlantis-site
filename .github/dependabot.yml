version: 2

registries:
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    replaces-base: false
    token: ${{secrets.PACKAGES_READ_TOKEN}}

updates:
  - package-ecosystem: npm
    directory: /
    registries:
      - github-packages
    schedule:
      interval: daily
      time: '09:00'
      timezone: Europe/London
    groups:
      ladyofcode-dice:
        patterns:
          - '@ladyofcode/*'
    allow:
      - dependency-name: '@ladyofcode/dice-engine'
      - dependency-name: '@ladyofcode/dice-themes'
    open-pull-requests-limit: 5
